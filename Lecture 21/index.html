<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Units Table</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        table{
            width: 700px;
            border-collapse: collapse;
            background-color: white;
        }

        th, td{
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
        }

        th{
            background-color: #333;
            color: white;
        }

        tr:nth-child(even){
            background-color: #f2f2f2;
        }

        caption{
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Absolute Units</caption>

        <tr>
            <th>Unit</th>
            <th>Meaning</th>
            <th>Example</th>
        </tr>

        <tr>
            <td>px</td>
            <td>Pixels</td>
            <td>width: 300px;</td>
        </tr>

        <tr>
            <td>cm</td>
            <td>Centimeters</td>
            <td>width: 5cm;</td>
        </tr>

        <tr>
            <td>mm</td>
            <td>Millimeters</td>
            <td>width: 20mm;</td>
        </tr>

        <tr>
            <td>in</td>
            <td>Inches</td>
            <td>width: 2in;</td>
        </tr>

        <tr>
            <td>pt</td>
            <td>Points (1/72 inch)</td>
            <td>font-size: 12pt;</td>
        </tr>

        <tr>
            <td>pc</td>
            <td>Picas (12 points)</td>
            <td>width: 5pc;</td>
        </tr>

    </table>

</body>
</html>
